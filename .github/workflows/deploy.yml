name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  # Cancel stuck/queued deploys so a fresh push isn't blocked.
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npm run typecheck && npm test
      - name: Build hosted PWA
        env:
          # GitHub Pages serves from a repo subpath. Tell Vite about it so
          # asset URLs resolve under /resume-editor/.
          APP_BASE: /resume-editor/
        run: npm run build
      - name: Build single-file html
        run: npm run build:single
      - name: Stage single-file html beside the PWA
        # Copy the self-contained html into dist/ so it's served from the
        # same origin as the PWA. This is what powers the in-app Replace flow:
        # the single-file build running from file:// can fetch this URL with
        # CORS:* and then write the bytes to the user-picked local file.
        run: cp dist-single/index.html dist/single.html
      - name: Deploy to gh-pages
        # Branch deploy avoids the Actions "deployment_queued" hang that
        # repeatedly stalled actions/deploy-pages. Site source is gh-pages.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
